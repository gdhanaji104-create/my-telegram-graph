<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Graph App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1c1c1e;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        img, object {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <h2>ESP32 Real-Time Current Graph</h2>
    <div class="container">
        <!-- Is line se aapki SVG graph file load hoti hai -->
        <object data="graph.svg" type="image/svg+xml" id="svgObject"></object>
    </div>

    <script>
        // Telegram App initialize karna
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand(); // Screen full expand karne ke liye
    </script>
</body>
</html>
